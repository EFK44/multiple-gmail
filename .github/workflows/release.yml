name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: true
      # Linux is in development: CI still builds and tests it, releases ship Windows and macOS.
      matrix:
        include:
          - os: windows-latest
            asset: multiple-gmail-windows-x64.exe
          - os: macos-15
            asset: multiple-gmail-macos-arm64
          - os: macos-15-intel
            asset: multiple-gmail-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build the single executable
        run: npm run build:exe -- --asset-name=${{ matrix.asset }}
      - name: Test the single executable
        run: npx vitest run test/build
        env:
          MG_REQUIRE_EXE: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          # The binary, and on macOS also <asset>.zip with multiple-gmail.app.
          path: build/release/${{ matrix.asset }}*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create the GitHub Release and upload the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -l assets
          (cd assets && sha256sum multiple-gmail-* > SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            # The fixed upgrade notes come first; gh appends the generated notes after them.
            gh release create "$TAG" assets/* --title "$TAG" --notes-file .github/release-notes.md --generate-notes --verify-tag
          fi
