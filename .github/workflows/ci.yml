name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15: Apple Silicon (arm64). macos-15-intel: the remaining x64 macOS image (macos-13 is retired).
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Real secret-tool round trip against a throwaway, unlocked gnome-keyring in a private D-Bus session.
      - name: Secret Service integration test
        if: runner.os == 'Linux'
        env:
          MG_SECRET_TOOL_IT: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsecret-tools gnome-keyring dbus
          dbus-run-session -- sh -c 'printf "mg-ci" | gnome-keyring-daemon --unlock --components=secrets > /dev/null && npx vitest run test/core/masterKeyPosix.test.ts'
      - run: npm run build:exe
      - name: Test the single executable
        run: npx vitest run test/build
        env:
          MG_REQUIRE_EXE: '1'
